<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #ffb000;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .container { max-width: 600px; }
        h1 {
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: 0.1em;
            text-shadow: 0 0 10px rgba(255, 176, 0, 0.5);
            margin-bottom: 1rem;
        }
        p {
            color: #b8860b;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 0.5rem;
        }
        .status {
            display: inline-block;
            margin-top: 2rem;
            padding: 0.5rem 1rem;
            border: 1px solid #ffb000;
            border-radius: 4px;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }
        .status::before {
            content: "● ";
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NEXUSAI</h1>
        <p>AI-powered deployment and monitoring for IP security cameras.</p>
        <p>Onboarding is by invitation — scan your QR code to connect your site.</p>
        <div class="status">SYSTEM ONLINE</div>
    </div>
</body>
</html>
