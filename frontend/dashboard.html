<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexusAI Dashboard</title>
<link rel="stylesheet" href="styles.css" />
<style>
  :root {
    --bg: #0a0a0a;
    --accent: #ff6b00;
    --green: #2ecc71;
    --red: #e74c3c;
    --card: #141414;
    --border: #262626;
    --text-muted: #999;
  }
  body {
    background: var(--bg);
    color: #f2f2f2;
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 24px;
  }
  h1, h2 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 16px;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 24px;
  }
  .badge {
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-family: 'IBM Plex Mono', monospace;
  }
  .badge.active { background: rgba(46,204,113,0.15); color: var(--green); }
  .badge.offline { background: rgba(231,76,60,0.15); color: var(--red); }
  .topbar .stat { font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); font-size: 0.85rem; }
  .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .camera-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 600px) { .camera-grid { grid-template-columns: 1fr; } }
  .camera-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .camera-card:hover { border-color: var(--accent); }
  .camera-card.selected { border-color: var(--accent); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .dot.active { background: var(--green); }
  .dot.offline, .dot.pending, .dot.error { background: var(--red); }
  .camera-card .last-alert { color: var(--text-muted); font-size: 0.8rem; margin-top: 8px; }
  .sidebar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    max-height: 640px;
    overflow-y: auto;
  }
  .alert-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    font-family: 'IBM Plex Mono', monospace;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
  }
  .alert-type.Theft { color: #f39c12; }
  .alert-type.Threat { color: var(--red); }
  .alert-type.Weapon { color: #ff2d55; }
  .actions { margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
  button {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .section-title { margin-bottom: 12px; }
  .empty-state { color: var(--text-muted); text-align: center; padding: 40px 0; font-family: 'IBM Plex Mono', monospace; }
</style>
</head>
<body>

<div class="topbar">
  <h1 id="site-name">Loading…</h1>
  <span class="badge" id="status-badge">—</span>
  <span class="stat" id="camera-count">— cameras</span>
  <span class="stat" id="alert-count">— alerts today</span>
  <button class="secondary" id="refresh-btn" style="margin-left:auto;">Refresh</button>
</div>

<div class="layout">
  <div>
    <h2 class="section-title">Cameras</h2>
    <div class="camera-grid" id="camera-grid"></div>

    <div class="actions">
      <button id="test-alert-btn">Test Alert</button>
      <button class="secondary" id="report-btn">Download Report</button>
    </div>
  </div>

  <div class="sidebar">
    <h2 class="section-title" id="alert-feed-title">Alert Feed</h2>
    <div id="alert-feed"></div>
  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
